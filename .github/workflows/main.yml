name: Build Paint Team 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачать проект
      - name: Скачать проект
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      # 4. Установить Android-компоненты
      - name: Установить Android SDK компоненты
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      # 5. Скачать Godot 4.6.1
      - name: Скачать Godot 4.6.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.1-stable_linux.x86_64

      # 6. Скачать Android export templates
      - name: Установить Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          unzip -q Godot_v4.6.1-stable_export_templates.tpz -d /tmp/godot_templates
          cp /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.6.1.stable/

      # 7. Проверить проект
      - name: Проверить Godot проект
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f Main.tscn
          echo "Проект Godot найден!"
          echo "Файлы:"
          ls -la

      # 8. Создать папку для APK
      - name: Создать папку build
        run: |
          mkdir -p build

      # 9. Собрать APK через Godot
      - name: Собрать APK
        run: |
          ./Godot_v4.6.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-debug "Android" \
            build/PaintTeam3D.apk

      # 10. Проверить APK
      - name: Проверить APK
        run: |
          ls -lh build/
          test -f build/PaintTeam3D.apk
          echo "APK успешно создан!"

      # 11. Загрузить APK
      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: PaintTeam3D-Android
          path: build/PaintTeam3D.apk
