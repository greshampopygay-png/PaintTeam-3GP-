name: Build Paint Team 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android компоненты
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Скачать Godot 4.6.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.1-stable_linux.x86_64

      - name: Установить Android templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          unzip -q Godot_v4.6.1-stable_export_templates.tpz -d /tmp/godot_templates
          cp /tmp/godot_templates/templates/* \
            ~/.local/share/godot/export_templates/4.6.1.stable/

            - name: Найти Java и настроить Godot
        run: |
          JAVA_HOME_REAL="$(readlink -f "$JAVA_HOME")"

          echo "JAVA_HOME = $JAVA_HOME_REAL"
          echo "ANDROID_HOME = $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"

          test -d "$JAVA_HOME_REAL/bin"
          test -f "$JAVA_HOME_REAL/bin/java"

          mkdir -p ~/.config/godot

          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_REAL"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

          echo "Java SDK:"
          ls -la "$JAVA_HOME_REAL/bin"

      - name: Проверить проект
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f Main.tscn
          test -f main.gd
          echo "Проект найден:"
          ls -la

      - name: Подготовить папку APK
        run: |
          mkdir -p build

      - name: Собрать APK
        run: |
          ./Godot_v4.6.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-debug "Android" \
            build/PaintTeam3D.apk

      - name: Проверить APK
        run: |
          ls -lh build/
          test -f build/PaintTeam3D.apk
          echo "APK успешно создан!"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: PaintTeam3D-Android
          path: build/PaintTeam3D.apk
